# ═══════════════════════════════════════════════════════════════
#  Srevox DB Auditor — Standalone Docker Compose Stack
# ═══════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: srevox-db-auditor-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-7432}:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-srevoxdbauditor}
      POSTGRES_USER:     ${POSTGRES_USER:-srevox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srevoxdbauditor}
    volumes:
      - srevox_db_auditor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srevox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srevox-db-auditor

  redis:
    image: redis:7-alpine
    container_name: srevox-db-auditor-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0 --protected-mode no
    ports:
      - "${REDIS_PORT:-7379}:6379"
    volumes:
      - srevox_db_auditor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srevox-db-auditor

  api:
    image: akshatsaini08/srevox-db-auditor-api:${SREVOX_VERSION:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: srevox-db-auditor-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-7001}:7001"
    env_file: .env
    environment:
      PORT:              7001
      API_PORT:          7001
      POSTGRES_HOST:     ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-srevoxdbauditor}
      POSTGRES_USER:     ${POSTGRES_USER:-srevox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srevoxdbauditor}
      REDIS_URL:         redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - srevox-db-auditor

  activity:
    image: akshatsaini08/srevox-db-auditor-activity:${SREVOX_VERSION:-latest}
    build:
      context: ./apps/activity-service
      dockerfile: Dockerfile
    container_name: srevox-db-auditor-activity
    restart: unless-stopped
    ports:
      - "${ACTIVITY_PORT:-7002}:7002"
    env_file: .env
    environment:
      ACTIVITY_PORT:     7002
      POSTGRES_HOST:     ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-srevoxdbauditor}
      POSTGRES_USER:     ${POSTGRES_USER:-srevox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srevoxdbauditor}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - srevox-db-auditor

  frontend:
    image: akshatsaini08/srevox-db-auditor-frontend:${SREVOX_VERSION:-latest}
    container_name: srevox-db-auditor-frontend
    restart: unless-stopped
    ports:
      - "7005:7005"
    env_file: .env
    environment:
      PORT: 7005
      API_URL: http://api:7001
      ACTIVITY_SERVICE_URL: http://activity:7002
    depends_on:
      - api
    networks:
      - srevox-db-auditor

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: srevox-db-auditor-clickhouse
    restart: unless-stopped
    ports:
      - "7123:8123"
      - "7900:9000"
    volumes:
      - srevox_db_auditor_clickhouse_data:/var/lib/clickhouse
      - ./infra/db-audit/02_clickhouse_schema.sql:/docker-entrypoint-initdb.d/02_clickhouse_schema.sql
    networks:
      - srevox-db-auditor

  db-audit-control:
    image: srevox-db-auditor-control:latest
    build:
      context: ./apps/db-audit-control
      dockerfile: Dockerfile
    container_name: srevox-db-auditor-control
    restart: unless-stopped
    ports:
      - "7003:7003"
    environment:
      PORT: 7003
      POSTGRES_HOST: postgres
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - postgres
      - clickhouse
    networks:
      - srevox-db-auditor

  db-audit-processor:
    image: srevox-db-auditor-processor:latest
    build:
      context: ./apps/db-audit-processor
      dockerfile: Dockerfile
    container_name: srevox-db-auditor-processor
    restart: unless-stopped
    ports:
      - "7004:7004"
    environment:
      PORT: 7004
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - clickhouse
    networks:
      - srevox-db-auditor

volumes:
  srevox_db_auditor_postgres_data:
  srevox_db_auditor_redis_data:
  srevox_db_auditor_clickhouse_data:

networks:
  srevox-db-auditor:
    driver: bridge
