[package]
name = "db-audit-processor"
version = "1.0.3"
edition = "2021"
authors = ["Srevox Engineering"]
description = "High-performance Rust streaming processor for CDC audit events, memory masking, and cryptographic ledger hash chaining"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
