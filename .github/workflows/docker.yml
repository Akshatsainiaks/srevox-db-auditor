name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        id: dockerhub_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push API ───────────────────────────────────────
      - name: Build & Push API (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-api:latest

      - name: Push API to Docker Hub (if token authorized)
        continue-on-error: true
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-api:latest

      # ── Build & Push Frontend ──────────────────────────────────
      - name: Build & Push Frontend (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-frontend:latest

      - name: Push Frontend to Docker Hub (if token authorized)
        continue-on-error: true
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-frontend:latest

      # ── Build & Push Activity Service ──────────────────────────
      - name: Build & Push Activity Service (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/activity-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/srevox-db-auditor-activity:latest

      - name: Push Activity Service to Docker Hub (if token authorized)
        continue-on-error: true
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/activity-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME || 'akshatsaini08' }}/srevox-db-auditor-activity:latest

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release in srevox-db-auditor
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Srevox DB Auditor ${{ github.ref_name }} Released 🚀

            Enterprise Database Audit, Real-Time CDC Tracking & DDL Intelligence.

            ### Quick Install (One-Command):
            ```bash
            curl -sSL https://raw.githubusercontent.com/Akshatsainiaks/srevox-db-auditor/main/setup.sh | bash
            ```

            ### Update Existing Instance:
            ```bash
            docker compose pull
            docker compose up -d
            ```
