name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push API ───────────────────────────────────────
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            ghcr.io/akshatsainiaks/srevox-db-auditor-api:latest
            akshatsaini08/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-api:latest

      # ── Build & Push Frontend ──────────────────────────────────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            ghcr.io/akshatsainiaks/srevox-db-auditor-frontend:latest
            akshatsaini08/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-frontend:latest

      # ── Build & Push Activity Service (Rust) ───────────────────
      - name: Build & Push Activity Service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/activity-service
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            ghcr.io/akshatsainiaks/srevox-db-auditor-activity:latest
            akshatsaini08/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-activity:latest

      # ── Build & Push DB Audit Control (Go) ─────────────────────
      - name: Build & Push DB Audit Control
        uses: docker/build-push-action@v5
        with:
          context: ./apps/db-audit-control
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-control:${{ steps.version.outputs.tag }}
            ghcr.io/akshatsainiaks/srevox-db-auditor-control:latest
            akshatsaini08/srevox-db-auditor-control:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-control:latest

      # ── Build & Push DB Audit Processor (Rust) ─────────────────
      - name: Build & Push DB Audit Processor
        uses: docker/build-push-action@v5
        with:
          context: ./apps/db-audit-processor
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-processor:${{ steps.version.outputs.tag }}
            ghcr.io/akshatsainiaks/srevox-db-auditor-processor:latest
            akshatsaini08/srevox-db-auditor-processor:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-processor:latest

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release in srevox-db-auditor
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Srevox DB Auditor ${{ github.ref_name }} Released 🚀

            Enterprise Database Audit, Real-Time CDC Tracking & DDL Intelligence.

            ### Quick Install (One-Command):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Akshatsainiaks/srevox-db-auditor/main/setup.sh | bash
            ```

            ### Update Existing Instance:
            ```bash
            docker compose pull
            docker compose up -d
            ```
