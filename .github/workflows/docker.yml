name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-api:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-api:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-frontend:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-frontend:latest

      - name: Build & Push Activity Service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/activity-service
          push: true
          tags: |
            ghcr.io/akshatsainiaks/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-activity:${{ steps.version.outputs.tag }}
            akshatsaini08/srevox-db-auditor-activity:latest

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release in srevox-db-auditor
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Srevox DB Auditor ${{ github.ref_name }} Released 🚀

            Enterprise Database Audit, DDL Tracking & CDC Intelligence.

            ### Quick Update:
            ```bash
            docker compose pull
            docker compose up -d
            ```
