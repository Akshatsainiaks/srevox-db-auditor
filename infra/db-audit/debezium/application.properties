# =============================================================================
# Debezium Server Engine Configuration for Database Change Data Capture (CDC)
# =============================================================================

debezium.sink.type=http
debezium.sink.http.url=http://db-audit-processor:8081/api/v1/cdc/events

# PostgreSQL CDC (pgoutput logical replication)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=srevox_cdc_slot
debezium.source.publication.name=srevox_audit_pub

# MySQL CDC (binlog streaming)
# debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
# debezium.source.binlog.buffer.size=1024

# SQL Server CDC (native CDC)
# debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector

# MongoDB CDC (Change Streams)
# debezium.source.connector.class=io.debezium.connector.mongodb.MongoDbConnector

debezium.source.tombstones.on.delete=false
debezium.source.decimal.handling.mode=double
